version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    cooldown:
      default-days: 7
    groups:
      jest:
        patterns:
          - "jest"
          - "jest-environment-jsdom"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 99
